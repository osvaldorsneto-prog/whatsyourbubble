name: Números do painel

# Salva os números do painel público em data/painel.json, pra que as tarefas
# automáticas leiam pelo GitHub sem precisar abrir o site.
on:
  schedule:
    - cron: "7 */3 * * *" # a cada 3 horas
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: painel-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Ler o painel
        run: python3 scripts/painel_snapshot.py
      - name: Salvar se mudou
        run: |
          if git diff --quiet -- data/painel.json && git ls-files --error-unmatch data/painel.json >/dev/null 2>&1; then
            echo "Nada mudou."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data/painel.json
          git commit -m "Números do painel $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
