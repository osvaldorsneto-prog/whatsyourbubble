name: Números do painel

# Salva os números do painel público em data/painel.json.
# Desligado em 21/11/2026: não roda mais sozinho (as regras do GitHub não querem Actions
# pra coisa fora de build/teste/deploy, e a conta tinha acabado de ser revisada).
# A rotina de ideias lê o painel direto do site. Só roda se alguém mandar à mão.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: painel-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Ler o painel
        run: python3 scripts/painel_snapshot.py
      - name: Salvar se mudou
        run: |
          if git diff --quiet -- data/painel.json && git ls-files --error-unmatch data/painel.json >/dev/null 2>&1; then
            echo "Nada mudou."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data/painel.json
          git commit -m "Números do painel $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
